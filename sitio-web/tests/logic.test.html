<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<title>logic.js tests</title>
<style>
  body { font-family: monospace; padding: 24px; background: #fff; color: #111; }
  .pass { color: #1a9e5c; }
  .fail { color: #c9105f; font-weight: bold; }
  #summary { font-size: 1.1rem; margin-top: 16px; font-weight: bold; }
  li { margin-bottom: 4px; }
</style>
</head>
<body>
<h1>logic.js test results</h1>
<ul id="results"></ul>
<div id="summary"></div>

<script src="../logic.js"></script>
<script>
(function () {
  const results = document.getElementById('results');
  let pass = 0;
  let fail = 0;

  function assertEqual(actual, expected, name) {
    const ok = JSON.stringify(actual) === JSON.stringify(expected);
    log(ok, name, ok ? '' : `expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
  }

  function assertTrue(actual, name) {
    log(!!actual, name, actual ? '' : 'expected truthy value');
  }

  function log(ok, name, detail) {
    ok ? pass++ : fail++;
    const li = document.createElement('li');
    li.className = ok ? 'pass' : 'fail';
    li.textContent = (ok ? '✓ ' : '✗ ') + name + (detail ? ` — ${detail}` : '');
    results.appendChild(li);
  }

  // formatoMXN
  assertEqual(AR.formatoMXN(110), '$110', 'formatoMXN formats whole pesos without decimals');
  assertTrue(AR.formatoMXN(1000).includes('1,000'), 'formatoMXN groups thousands');

  // distanciaKm — Toluca to itself is 0
  assertEqual(Math.round(AR.distanciaKm(AR.TOLUCA_LAT, AR.TOLUCA_LON, AR.TOLUCA_LAT, AR.TOLUCA_LON)), 0, 'distanciaKm(Toluca, Toluca) is 0');
  // Toluca to Mexico City center (~19.4326,-99.1332) is roughly 55-70km
  const distCdmx = AR.distanciaKm(AR.TOLUCA_LAT, AR.TOLUCA_LON, 19.4326, -99.1332);
  assertTrue(distCdmx > 40 && distCdmx < 80, 'distanciaKm(Toluca, CDMX) is in a plausible range (' + distCdmx.toFixed(1) + 'km)');

  // validateFeedback
  assertEqual(AR.validateFeedback({ rating: 0, comentario: '' }), { valid: false, error: 'Agrega una calificación o un comentario antes de enviar.' }, 'validateFeedback rejects empty rating and comment');
  assertEqual(AR.validateFeedback({ rating: 0, comentario: '   ' }), { valid: false, error: 'Agrega una calificación o un comentario antes de enviar.' }, 'validateFeedback rejects whitespace-only comment with no rating');
  assertEqual(AR.validateFeedback({ rating: 4, comentario: '' }), { valid: true, error: null }, 'validateFeedback accepts a rating alone');
  assertEqual(AR.validateFeedback({ rating: 0, comentario: 'Muy buen servicio' }), { valid: true, error: null }, 'validateFeedback accepts a comment alone');
  assertEqual(AR.validateFeedback({ rating: 6, comentario: '' }), { valid: false, error: 'Agrega una calificación o un comentario antes de enviar.' }, 'validateFeedback rejects an out-of-range rating with no comment');

  // buildFeedbackMessage
  assertEqual(
    AR.buildFeedbackMessage({ rating: 5, comentario: '' }),
    'Hola, quiero dejar una opinión sobre el servicio:\n• Calificación: ★★★★★ (5/5)',
    'buildFeedbackMessage renders a full 5-star line with no comment line'
  );
  assertEqual(
    AR.buildFeedbackMessage({ rating: 3, comentario: '' }),
    'Hola, quiero dejar una opinión sobre el servicio:\n• Calificación: ★★★☆☆ (3/5)',
    'buildFeedbackMessage renders partial stars correctly'
  );
  assertEqual(
    AR.buildFeedbackMessage({ rating: 0, comentario: '  Excelente atención  ' }),
    'Hola, quiero dejar una opinión sobre el servicio:\n• Comentario: Excelente atención',
    'buildFeedbackMessage trims comment and omits rating line when there is none'
  );
  assertEqual(
    AR.buildFeedbackMessage({ rating: 4, comentario: 'Todo bien' }),
    'Hola, quiero dejar una opinión sobre el servicio:\n• Calificación: ★★★★☆ (4/5)\n• Comentario: Todo bien',
    'buildFeedbackMessage includes both rating and comment lines when both are present'
  );

  // precioAndamioPorDia (tabla cantidad x días)
  assertEqual(AR.precioAndamioPorDia(1, 1), 200, 'precioAndamioPorDia: 1 andamio 1 día = $200');
  assertEqual(AR.precioAndamioPorDia(5, 1), 110, 'precioAndamioPorDia: 1 andamio 5 días = $110');
  assertEqual(AR.precioAndamioPorDia(30, 1), 60, 'precioAndamioPorDia: 1 andamio 30 días = $60');
  assertEqual(AR.precioAndamioPorDia(5, 10), 75, 'precioAndamioPorDia: 10 andamios 5 días = $75');
  assertEqual(AR.precioAndamioPorDia(30, 12), 45, 'precioAndamioPorDia: 12 andamios 30 días = $45');
  assertEqual(AR.precioAndamioPorDia(45, 20), AR.precioAndamioPorDia(30, 12), 'precioAndamioPorDia: más de 12 andamios / 30 días usa el último renglón y columna');
  assertEqual(AR.precioAndamioPorDia(0, 0), 200, 'precioAndamioPorDia: valores menores a 1 se toman como 1');
  assertEqual(AR.TARIFAS_ANDAMIO.length, 12, 'TARIFAS_ANDAMIO tiene 12 renglones (andamios)');
  assertTrue(AR.TARIFAS_ANDAMIO.every(fila => fila.length === 30), 'TARIFAS_ANDAMIO tiene 30 columnas (días) en cada renglón');
  const noSube = AR.TARIFAS_ANDAMIO.every((fila, i) =>
    fila.every((p, j) => (j === 0 || p <= fila[j - 1]) && (i === 0 || p <= AR.TARIFAS_ANDAMIO[i - 1][j])));
  assertTrue(noSube, 'TARIFAS_ANDAMIO nunca sube al aumentar días ni cantidad de andamios');

  // normalizarTelefonoE164
  assertEqual(AR.normalizarTelefonoE164('722 000 0000'), '+527220000000', 'normalizarTelefonoE164 formats a 10-digit local number to E.164');
  assertEqual(AR.normalizarTelefonoE164('(722) 000-0000'), '+527220000000', 'normalizarTelefonoE164 strips punctuation from a local number');
  assertEqual(AR.normalizarTelefonoE164('+52 722 000 0000'), '+527220000000', 'normalizarTelefonoE164 keeps a number that already has the country code');
  assertEqual(AR.normalizarTelefonoE164('52 1 722 000 0000'), '+5217220000000', 'normalizarTelefonoE164 keeps the legacy 521 mobile prefix');
  assertEqual(AR.normalizarTelefonoE164('12345'), null, 'normalizarTelefonoE164 returns null for an incomplete number');
  assertEqual(AR.normalizarTelefonoE164(''), null, 'normalizarTelefonoE164 returns null for an empty value');

  const summary = document.getElementById('summary');
  summary.className = fail === 0 ? 'pass' : 'fail';
  summary.textContent = `${pass} passed, ${fail} failed`;
  document.title = (fail === 0 ? 'PASS' : 'FAIL') + ' - logic.js tests';
})();
</script>
</body>
</html>
